name: Fetch Android APK Signing Tools

on:
  push:
    branches: [ american-english-j2me-apk ]
    paths:
      - '.github/workflows/fetch-apksigner-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - name: Download Android apksig
        run: |
          mkdir -p tools
          curl -L --fail --retry 3 -o tools/apksig.jar \
            https://dl.google.com/dl/android/maven2/com/android/tools/build/apksig/8.5.2/apksig-8.5.2.jar
          ls -lh tools/apksig.jar
      - name: Upload signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-signing-tools
          path: tools/
          retention-days: 7
