name: Fetch Android APK Signing Tools

on:
  push:
    branches: [ american-english-j2me-apk ]
    paths:
      - '.github/workflows/fetch-apksigner-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Locate preinstalled Android build tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          test -n "$APKSIGNER"
          test -n "$ZIPALIGN"
          DIR="$(dirname "$APKSIGNER")"
          mkdir -p tools
          cp "$APKSIGNER" tools/
          cp "$ZIPALIGN" tools/
          cp -a "$DIR/lib" tools/
          echo "Using $DIR"
          ls -lh tools tools/lib
      - name: Upload signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-signing-tools-full
          path: tools/
          retention-days: 7
