name: Build Android APK

on:
  push:
    branches: [ main, andbible-redesign ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Extract and adapt project for AGP 9
        run: |
          rm -rf build-project
          mkdir build-project
          unzip -q BibleAmplifieeFR_AndroidStudio_Logo_Quanda.zip -d build-project
          PROJECT=build-project/BibleAmplifieeFR

          # Apply the AndBible-inspired Quanda redesign over the original project.
          cp overrides/app/src/main/java/com/webmotion/bibleamplifiee/BibleApp.kt "$PROJECT/app/src/main/java/com/webmotion/bibleamplifiee/BibleApp.kt"
          cp overrides/app/src/main/java/com/webmotion/bibleamplifiee/BibleViewModel.kt "$PROJECT/app/src/main/java/com/webmotion/bibleamplifiee/BibleViewModel.kt"
          cp overrides/app/src/main/java/com/webmotion/bibleamplifiee/data/BibleModels.kt "$PROJECT/app/src/main/java/com/webmotion/bibleamplifiee/data/BibleModels.kt"
          cp overrides/app/src/main/java/com/webmotion/bibleamplifiee/data/PreferenceStore.kt "$PROJECT/app/src/main/java/com/webmotion/bibleamplifiee/data/PreferenceStore.kt"

          # Kotlin: a trailing lambda would bind to SearchHitRow.supporting because
          # onClick is not the last parameter. Keep the fix explicit in the build.
          sed -i 's/SearchHitRow(hit) { vm.openRef(hit.ref) }/SearchHitRow(hit, onClick = { vm.openRef(hit.ref) })/' "$PROJECT/app/src/main/java/com/webmotion/bibleamplifiee/BibleApp.kt"

          sed -i 's/compileSdk = 37/compileSdk = 36/' "$PROJECT/app/build.gradle.kts"
          sed -i 's/targetSdk = 37/targetSdk = 36/' "$PROJECT/app/build.gradle.kts"
          sed -i '/org.jetbrains.kotlin.android/d' "$PROJECT/build.gradle.kts"
          sed -i '/org.jetbrains.kotlin.android/d' "$PROJECT/app/build.gradle.kts"
          sed -i '/android.builtInKotlin=false/d' "$PROJECT/gradle.properties"
          sed -i 's/compose-bom:2026.08.00/compose-bom:2025.06.01/' "$PROJECT/app/build.gradle.kts"
          sed -i 's/androidx.activity:activity-compose:1.13.0/androidx.activity:activity-compose:1.10.1/' "$PROJECT/app/build.gradle.kts"
          sed -i 's/androidx.lifecycle:lifecycle-runtime-ktx:2.11.0/androidx.lifecycle:lifecycle-runtime-ktx:2.9.2/' "$PROJECT/app/build.gradle.kts"
          sed -i 's/androidx.lifecycle:lifecycle-runtime-compose:2.11.0/androidx.lifecycle:lifecycle-runtime-compose:2.9.2/' "$PROJECT/app/build.gradle.kts"
          sed -i 's/androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0/androidx.lifecycle:lifecycle-viewmodel-compose:2.9.2/' "$PROJECT/app/build.gradle.kts"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build-project/BibleAmplifieeFR/app/build.gradle.kts')
          s = p.read_text()
          s = s.replace('''    kotlinOptions {\n        jvmTarget = "17"\n    }\n\n''', '')
          p.write_text(s)
          PY

      - name: Build debug APK
        working-directory: build-project/BibleAmplifieeFR
        run: gradle :app:assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p apk-output
          cp build-project/BibleAmplifieeFR/app/build/outputs/apk/debug/app-debug.apk apk-output/Quanda-Bible-Amplifiee-AndBible-Design.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quanda-Bible-Amplifiee-AndBible-Design-APK
          path: apk-output/Quanda-Bible-Amplifiee-AndBible-Design.apk
          if-no-files-found: error
          retention-days: 30
