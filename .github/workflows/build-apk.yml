name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37
        run: yes | sdkmanager --licenses >/dev/null || true; sdkmanager "platforms;android-37" "build-tools;37.0.0"

      - name: Extract project
        run: |
          rm -rf build-project
          mkdir build-project
          unzip -q BibleAmplifieeFR_AndroidStudio_Logo_Quanda.zip -d build-project
          ls -la build-project/BibleAmplifieeFR

      - name: Build debug APK
        working-directory: build-project/BibleAmplifieeFR
        run: gradle :app:assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p apk-output
          cp build-project/BibleAmplifieeFR/app/build/outputs/apk/debug/app-debug.apk apk-output/Quanda-Bible-Amplifiee.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quanda-Bible-Amplifiee-APK
          path: apk-output/Quanda-Bible-Amplifiee.apk
          if-no-files-found: error
          retention-days: 30
