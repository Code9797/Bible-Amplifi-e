name: Build Quanda Bible from AndBible GPL source

on:
  push:
    branches: [ andbible-redesign ]
    paths:
      - '.github/workflows/build-quanda-andbible-apk.yml'
      - 'quanda-andbible/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: andbible-redesign
          fetch-depth: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build Quanda standard GitHub debug APK
        working-directory: quanda-andbible
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console plain assembleStandardGithubDebug

      - name: Collect APK
        run: |
          mkdir -p apk-output
          APK=$(find quanda-andbible/app/build/outputs/apk/standardGithub/debug -name '*.apk' -type f | head -1)
          test -n "$APK"
          cp "$APK" apk-output/Quanda-Bible-Amplifiee-AndBible-GPL.apk
          ls -lh apk-output/Quanda-Bible-Amplifiee-AndBible-GPL.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quanda-Bible-Amplifiee-AndBible-GPL-APK
          path: apk-output/Quanda-Bible-Amplifiee-AndBible-GPL.apk
          if-no-files-found: error
          retention-days: 30
