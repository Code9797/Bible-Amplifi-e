name: Fix redesign source

on:
  push:
    branches: [ andbible-redesign ]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: andbible-redesign
      - name: Fix Kotlin call and commit if needed
        run: |
          FILE=overrides/app/src/main/java/com/webmotion/bibleamplifiee/BibleApp.kt
          sed -i 's/SearchHitRow(hit) { vm.openRef(hit.ref) }/SearchHitRow(hit, onClick = { vm.openRef(hit.ref) })/' "$FILE"
          if git diff --quiet -- "$FILE"; then
            echo "Source already fixed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "Corriger SearchHitRow dans la source de la refonte"
          git push origin HEAD:andbible-redesign
